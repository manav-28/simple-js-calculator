<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculate me! - Simple JS Calculator</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="utils.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <h1 class="text-center">Simple JS Calculator</h1>
  <div class="container flex flex-col items-center mx-auto m-w-20">
    <div class="row">
      <input id="display" class="input" type="text" readonly aria-label="Calculator display" value="" />
    </div>
    <div class="memory-indicator" id="memory-indicator" aria-live="polite">&nbsp;</div>
    <div class="row">
      <button type="button" class="button color-grey" data-action="memory-clear" title="Memory clear">MC</button>
      <button type="button" class="button color-grey" data-action="memory-recall" title="Memory recall">MR</button>
      <button type="button" class="button color-grey" data-action="backspace" title="Backspace">&#9003;</button>
    </div>
    <div class="row">
      <button type="button" class="button color-red" data-action="clear">C</button>
      <button type="button" class="button color-grey" data-action="percent">%</button>
      <button type="button" class="button color-grey" data-action="memory-add" title="Add to memory">M+</button>
      <button type="button" class="button color-grey" data-action="memory-subtract" title="Subtract from memory">M-</button>
    </div>
    <div class="row">
      <button type="button" class="button" data-value="7">7</button>
      <button type="button" class="button" data-value="8">8</button>
      <button type="button" class="button" data-value="9">9</button>
      <button type="button" class="button color-gold" data-value="*">*</button>
    </div>
    <div class="row">
      <button type="button" class="button" data-value="4">4</button>
      <button type="button" class="button" data-value="5">5</button>
      <button type="button" class="button" data-value="6">6</button>
      <button type="button" class="button color-gold" data-value="/">/</button>
    </div>
    <div class="row">
      <button type="button" class="button" data-value="1">1</button>
      <button type="button" class="button" data-value="2">2</button>
      <button type="button" class="button" data-value="3">3</button>
      <button type="button" class="button color-gold" data-value="+">+</button>
    </div>
    <div class="row">
      <button type="button" class="button" data-value="0">0</button>
      <button type="button" class="button" data-value=".">.</button>
      <button type="button" class="button color-green" data-action="equals">=</button>
      <button type="button" class="button color-gold" data-value="-">-</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
